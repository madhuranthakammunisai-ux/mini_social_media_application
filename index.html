<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse | Mini Social Media Platform</title>
  <meta name="description" content="Pulse - A sleek, modern glassmorphism social media platform built with Django/Express API architecture, JWT auth, dynamic post feed, likes, comments, and real-time social networking features.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-container">
    <!-- Top Navigation Header -->
    <header class="navbar">
      <div class="nav-brand" id="nav-logo">
        <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        Pulse
      </div>

      <div class="search-box">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="text" id="search-input" placeholder="Search users, posts & tags...">
      </div>

      <div class="nav-actions">
        <div class="status-badge" id="status-badge">
          <span class="status-dot"></span> System Ready
        </div>

        <button class="btn btn-primary" id="open-auth-btn">Log In / Register</button>

        <div class="user-pill" id="user-pill" style="display:none;align-items:center;gap:0.6rem;cursor:pointer">
          <img src="" id="nav-avatar" class="avatar avatar-sm" alt="User avatar">
          <span id="nav-username" style="font-weight:600;font-size:0.9rem"></span>
        </div>

        <button class="btn btn-secondary btn-icon" id="logout-btn" style="display:none" title="Log Out">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Grid -->
    <main class="main-wrapper">
      
      <!-- Left Sidebar -->
      <aside class="left-sidebar">
        <nav class="sidebar-menu">
          <div class="nav-item active" id="nav-feed">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Home Feed
          </div>
          <div class="nav-item" id="nav-my-profile">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            My Profile
          </div>
        </nav>
      </aside>

      <!-- Center Main Section -->
      <section class="main-content">
        
        <!-- View 1: Feed View -->
        <div id="feed-view">
          <h1 style="font-size:1.5rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between">
            <span>Explore Community Feed</span>
          </h1>

          <!-- Create Post Widget -->
          <div class="glass-card create-post-card">
            <div class="create-post-header">
              <textarea id="create-post-caption" class="create-post-input" placeholder="What's happening in your world? Share thoughts, code, or ideas..."></textarea>
            </div>

            <div class="media-preview-container" id="media-preview-container">
              <button class="remove-media-btn" id="remove-media-btn">&times;</button>
              <img id="media-preview-img" src="" alt="Selected image preview">
            </div>

            <div class="create-post-actions">
              <label class="upload-btn-wrapper">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span>Add Image</span>
                <input type="file" id="image-upload-input" accept="image/*" style="display:none">
              </label>

              <button class="btn btn-primary" id="create-post-btn">Publish Post</button>
            </div>
          </div>

          <!-- Feed Filter Tabs -->
          <div class="feed-tabs">
            <div class="feed-tab active" data-tab="all">All Posts</div>
            <div class="feed-tab" data-tab="following">Following</div>
          </div>

          <!-- Posts Container -->
          <div id="posts-container">
            <!-- Dynamic Post Cards injected here -->
          </div>
        </div>

        <!-- View 2: Profile Page View -->
        <div id="profile-view" style="display:none">
          <div class="glass-card profile-header-card">
            <div class="profile-cover"></div>
            <div class="profile-info-bar">
              <div style="display:flex;align-items:flex-end;gap:1.5rem">
                <div class="profile-avatar-wrapper">
                  <img src="" id="profile-avatar" alt="User avatar">
                </div>
                <div class="profile-details">
                  <h2 id="profile-username">@username</h2>
                  <div class="profile-bio" id="profile-bio">Bio description goes here...</div>
                </div>
              </div>

              <div>
                <button class="btn btn-primary" id="profile-follow-btn">Follow</button>
                <button class="btn btn-secondary" id="edit-profile-btn" style="display:none">Edit Profile</button>
              </div>
            </div>

            <div style="padding:0 2rem 1.5rem 2rem">
              <div class="profile-stats">
                <div class="stat-box">
                  <span class="stat-value" id="stat-posts">0</span>
                  <span class="stat-label">Posts</span>
                </div>
                <div class="stat-box" id="box-followers" style="cursor:pointer" title="Click to view followers">
                  <span class="stat-value" id="stat-followers">0</span>
                  <span class="stat-label">Followers</span>
                </div>
                <div class="stat-box" id="box-following" style="cursor:pointer" title="Click to view following">
                  <span class="stat-value" id="stat-following">0</span>
                  <span class="stat-label">Following</span>
                </div>
              </div>
            </div>
          </div>

          <h3 style="margin-bottom:1rem">User Posts</h3>
          <div id="profile-posts-grid">
            <!-- Profile posts injected here -->
          </div>
        </div>

      </section>

      <!-- Right Sidebar (Trends & Who to follow) -->
      <aside class="right-sidebar">
        <div class="glass-card" style="padding:1.25rem;margin-bottom:1.5rem">
          <h3 style="font-size:1.1rem;margin-bottom:1rem">Suggested Connections</h3>
          <div style="display:flex;flex-direction:column;gap:1rem">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <div style="display:flex;align-items:center;gap:0.75rem;cursor:pointer" onclick="switchView('profile', 2)">
                <img src="assets/user_avatar_designer_1784866661484.png" class="avatar avatar-sm" alt="Sophia">
                <div>
                  <div style="font-weight:600;font-size:0.85rem">@sophia_design</div>
                  <div style="font-size:0.75rem;color:var(--text-dim)">UI/UX Lead</div>
                </div>
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between">
              <div style="display:flex;align-items:center;gap:0.75rem;cursor:pointer" onclick="switchView('profile', 1)">
                <img src="assets/user_avatar_tech_1784866551801.png" class="avatar avatar-sm" alt="Alex">
                <div>
                  <div style="font-weight:600;font-size:0.85rem">@alex_dev</div>
                  <div style="font-size:0.75rem;color:var(--text-dim)">Fullstack Dev</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>

    </main>
  </div>

  <!-- Auth Modal (Login / Register) -->
  <div class="modal-overlay" id="auth-modal">
    <div class="glass-card modal-card">
      <button class="modal-close-btn" id="close-auth-btn">&times;</button>
      
      <div style="display:flex;gap:1rem;margin-bottom:1.5rem;border-bottom:1px solid var(--border-glass)">
        <div class="feed-tab active" id="tab-login" style="padding-bottom:0.5rem">Sign In</div>
        <div class="feed-tab" id="tab-register" style="padding-bottom:0.5rem">Register</div>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" required placeholder="alex@example.com">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" style="display:none">
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" class="form-control" required placeholder="alex_dev">
        </div>
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" required placeholder="alex@example.com">
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-control" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="reg-bio">Short Bio</label>
          <input type="text" id="reg-bio" class="form-control" placeholder="Developer, builder, creator...">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
      </form>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="edit-profile-modal">
    <div class="glass-card modal-card">
      <button class="modal-close-btn" id="close-edit-profile-btn">&times;</button>
      <h3 style="margin-bottom:1.25rem">Edit Profile Details</h3>
      
      <form id="edit-profile-form">
        <div class="form-group">
          <label for="edit-bio-input">Bio</label>
          <textarea id="edit-bio-input" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="edit-avatar-input">Change Profile Picture</label>
          <input type="file" id="edit-avatar-input" accept="image/*" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Save Changes</button>
  <!-- Followers / Following List Modal -->
  <div class="modal-overlay" id="user-list-modal">
    <div class="glass-card modal-card" style="max-width:440px">
      <button class="modal-close-btn" id="close-user-list-btn">&times;</button>
      <h3 id="user-list-modal-title" style="margin-bottom:1.25rem">Followers</h3>
      
      <div id="user-list-modal-content" style="display:flex;flex-direction:column;gap:0.85rem;max-height:360px;overflow-y:auto;padding-right:0.25rem">
        <!-- Dynamic user list items -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
